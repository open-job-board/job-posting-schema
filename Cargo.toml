[package]
name = "job-posting-schema"
version = "0.1.0"
edition = "2021"
description = "JobPosting structure and JSON Schema generator for API validation"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
